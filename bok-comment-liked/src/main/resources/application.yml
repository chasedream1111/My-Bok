server:
  port: 8085

spring:
  profiles:
    # 默认本地开发；线上用 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: dev
  cloud:
    # Spring Boot 4.1.2 与 Spring Cloud 2025.1.x 的版本自检不匹配，关闭自检
    compatibility-verifier:
      enabled: false

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.gsy.bok.domain
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  global-config:
    db-config:
      id-type: auto

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true