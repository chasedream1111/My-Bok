server:
  port: 8081

spring:
  profiles:
    # 默认本地开发；线上用 SPRING_PROFILES_ACTIVE=prod 或 --spring.profiles.active=prod 覆盖
    active: dev
  cloud:
    # Spring Boot 4.1.2 与 Spring Cloud 2025.1.x(5.1.0-M1) 的版本自检不匹配，关闭该自检。
    # 与 Nacos 服务端版本无关，所有环境都要保留。
    compatibility-verifier:
      enabled: false
  rabbitmq:
    # 生产者 confirm：correlated 才能通过 CorrelationData 区分是哪条消息被确认
    publisher-confirm-type: correlated
    # 生产者 return：消息没有路由到任何队列时触发 ReturnsCallback（还需要 template.mandatory）
    publisher-returns: true
    connection-timeout: 10s
    template:
      # 没有匹配队列时把消息退回给生产者，而不是静默丢弃
      mandatory: true
      # 生产者重试：broker 不可用等发送异常时在本地重试
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        multiplier: 2
        max-interval: 10000ms
    listener:
      simple:
        # 每个消费者一次只预取一条，处理完再取下一条，避免消息堆在客户端内存
        prefetch: 1
        acknowledge-mode: auto
        # 消费重试：处理逻辑抛异常时本地重试，超过次数后不再重新入队（避免死循环）
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2
          max-interval: 10000ms

mybatis-plus:
  # mapper xml 位置
  mapper-locations: classpath:mapper/*.xml
  # 实体别名包
  type-aliases-package: com.gsy.bok.domain
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # 开启返回字段为 null 也保留
    call-setters-on-nulls: true
  global-config:
    db-config:
      # 主键策略：自动递增
      id-type: auto

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 只暴露必要的 actuator 端点，不要 include: "*"
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
oss:
  endpoint: https://oss-cn-beijing.aliyuncs.com
  region: cn-beijing
  bucket: my-bok
  dirprefix: bok/user/
jwt:
  login:
    # token 有效期（分钟）。JWT 的 exp 和 Redis 里登录态的 TTL 都用这个值
    expiration: 30
