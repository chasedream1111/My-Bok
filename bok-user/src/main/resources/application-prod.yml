# 线上环境：地址全部走环境变量，不要把生产密码写进仓库
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:bok-mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bok_user}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      max-lifetime: 1800000
  cloud:
    sentinel:
      transport:
        # 应用与 Dashboard 都在容器网络内，直接用服务名（容器内端口 8858）
        dashboard: ${SENTINEL_DASHBOARD:bok-sentinel:8858}
      http-method-specify: true
  data:
    redis:
      host: ${REDIS_HOST:bok-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

seata:
  enabled: true
  application-id: bok-user
  tx-service-group: bok-tx-group
  registry:
    # 线上应用和 TC 在同一容器网络里，可以走 Nacos 发现
    type: nacos
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:bok-nacos:8848}
      namespace: ${NACOS_NAMESPACE:public}
      group: SEATA_GROUP
      application: seata-server
  service:
    vgroup-mapping:
      bok-tx-group: default

logging:
  level:
    com.gsy: info
  file:
    name: ${LOG_PATH:logs}/bok-user.log
