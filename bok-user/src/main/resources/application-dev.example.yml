# 本地开发环境：依赖本机 Docker Desktop 里的 MySQL / Nacos / Seata / Sentinel
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3311/bok_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 用环境变量覆盖，默认值只是本机开发用，避免把真实密码提交进仓库
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    sentinel:
      transport:
        # 宿主机映射端口（容器内是 8858）
        dashboard: 127.0.0.1:8851
        # Dashboard 在容器里，要反向拉取应用 8719 的数据，必须给它一个容器内可解析的地址
        client-ip: host.docker.internal
      http-method-specify: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3s

seata:
  enabled: true
  application-id: bok-user
  tx-service-group: bok-tx-group
  registry:
    # 本地用 file + grouplist：TC 注册到 Nacos 的是容器 IP(172.23.x.x)，宿主机访问不到
    type: file
  service:
    grouplist:
      default: 127.0.0.1:8850
    vgroup-mapping:
      bok-tx-group: default

logging:
  level:
    com.gsy: info
    # 只对 Mapper 开 SQL 日志，避免把请求体（含明文密码）打进日志
    com.gsy.bok.mapper: debug
