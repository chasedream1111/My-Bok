server:
  port: 8080

spring:
  profiles:
    # 默认本地开发；线上用 SPRING_PROFILES_ACTIVE=prod 或 --spring.profiles.active=prod 覆盖
    active: dev
  cloud:
    # Spring Boot 4.1.2 与 Spring Cloud 2025.1.x(5.1.0-M1) 的版本自检不匹配，关闭该自检。
    # 与 Nacos 服务端版本无关，所有环境都要保留。
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: bok-user
              uri: lb://bok-user
              predicates:
                - Path=/user/**
            - id: bok-blog
              uri: lb://bok-blog
              predicates:
                - Path=/blog/**
            - id: bok-blog-liked
              uri: lb://bok-blog-liked
              predicates:
                - Path=/blog-liked/**
            - id: bok-blog-comment
              uri: lb://bok-blog-comment
              predicates:
                - Path=/blog-comment/**
            - id: bok-comment-liked
              uri: lb://bok-comment-liked
              predicates:
                - Path=/blog-comment-liked/**
feign:
  okhttp:
    enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
